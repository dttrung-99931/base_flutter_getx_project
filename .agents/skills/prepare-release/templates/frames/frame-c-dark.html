<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Frame C — Dark</title>
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <style>
    :root {
      --primary: #7C3AED;
      --accent: #6366F1;
      --canvas-w: 1080px;
      --canvas-h: 1920px;
      --slate-900: #0F172A;
      --slate-800: #1E293B;
      --white: #FFFFFF;
      --white-soft: rgba(248, 250, 252, 0.78);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--canvas-w);
      height: var(--canvas-h);
      overflow: hidden;
      font-family: 'Urbanist', system-ui, sans-serif;
      background: var(--slate-900);
      color: var(--white);
    }
    .canvas {
      position: relative;
      width: var(--canvas-w);
      height: var(--canvas-h);
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 55% at 50% 0%, color-mix(in srgb, var(--primary) 45%, transparent), transparent 65%),
        radial-gradient(ellipse 50% 40% at 100% 60%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%),
        var(--slate-900);
    }
    .copy {
      position: absolute;
      top: 5%;
      left: 6.5%;
      right: 6.5%;
      text-align: center;
      z-index: 2;
    }
    #title {
      font-weight: 800;
      font-size: clamp(40px, 6.5vw, 72px);
      line-height: 1.12;
      letter-spacing: -0.02em;
    }
    #subtitle {
      margin-top: 1vh;
      font-weight: 500;
      font-size: clamp(22px, 3.1vw, 34px);
      line-height: 1.35;
      color: var(--white-soft);
    }
    .accent-bar {
      width: 72px;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      margin: 28px auto 0;
    }
    .phone-wrap {
      position: absolute;
      left: 50%;
      top: 19.3%;
      transform: translateX(-50%);
      width: 72%;
      max-width: 820px;
      z-index: 1;
    }
    .phone {
      width: 100%;
      border-radius: 64px;
      background: var(--slate-800);
      padding: 16px;
      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.55),
        0 0 0 2px color-mix(in srgb, var(--primary) 65%, transparent),
        0 0 60px color-mix(in srgb, var(--primary) 35%, transparent);
    }
    .phone-screen {
      border-radius: 50px;
      overflow: hidden;
      background: #fff;
      aspect-ratio: 9 / 19.5;
      height: auto;
    }
    .phone-screen img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .notch {
      position: absolute;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      width: 22%;
      height: 26px;
      background: #020617;
      border-radius: 18px;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="copy">
      <h1 id="title">Your headline</h1>
      <p id="subtitle">Short supporting line</p>
      <div class="accent-bar"></div>
    </div>
    <div class="phone-wrap">
      <div class="notch"></div>
      <div class="phone">
        <div class="phone-screen">
          <img id="shot" alt="App screenshot" />
        </div>
      </div>
    </div>
  </div>
  <script src="./frame-shared.js"></script>
</body>
</html>
