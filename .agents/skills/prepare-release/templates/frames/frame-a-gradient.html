<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Frame A — Gradient</title>
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <style>
    :root {
      --primary: #7C3AED;
      --accent: #6366F1;
      --canvas-w: 1080px;
      --canvas-h: 1920px;
      --white: #FFFFFF;
      --white-soft: rgba(255, 255, 255, 0.88);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--canvas-w);
      height: var(--canvas-h);
      overflow: hidden;
      font-family: 'Urbanist', system-ui, sans-serif;
      background: linear-gradient(160deg, var(--primary) 0%, var(--accent) 55%, var(--primary) 100%);
      color: var(--white);
    }
    .canvas {
      position: relative;
      width: var(--canvas-w);
      height: var(--canvas-h);
      overflow: hidden;
    }
    .glow {
      position: absolute;
      width: 65%;
      height: 36%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, transparent 70%);
      top: -6%;
      right: -12%;
      pointer-events: none;
    }
    .copy {
      position: absolute;
      top: 5%;
      left: 6.5%;
      right: 6.5%;
      text-align: center;
      z-index: 2;
    }
    #title {
      font-weight: 800;
      font-size: clamp(40px, 6.5vw, 72px);
      line-height: 1.12;
      letter-spacing: -0.02em;
      text-shadow: 0 8px 32px rgba(15, 23, 42, 0.25);
    }
    #subtitle {
      margin-top: 1vh;
      font-weight: 500;
      font-size: clamp(22px, 3.1vw, 34px);
      line-height: 1.35;
      color: var(--white-soft);
    }
    .phone-wrap {
      position: absolute;
      left: 50%;
      top: 18.75%;
      transform: translateX(-50%);
      width: 72%;
      max-width: 820px;
      z-index: 1;
    }
    .phone {
      width: 100%;
      border-radius: 64px;
      background: #0F172A;
      padding: 18px;
      box-shadow:
        0 40px 100px rgba(15, 23, 42, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 80px rgba(255, 255, 255, 0.18);
    }
    .phone-screen {
      border-radius: 48px;
      overflow: hidden;
      background: #fff;
      /* Fit by height so bottom UI (e.g. FAB) is not cropped */
      aspect-ratio: 9 / 19.5;
      max-height: 78%;
      height: auto;
    }
    .phone-screen img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: fill;
    }
    .notch {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 23%;
      height: 28px;
      background: #0F172A;
      border-radius: 20px;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="copy">
      <h1 id="title">Your headline</h1>
      <p id="subtitle">Short supporting line</p>
    </div>
    <div class="phone-wrap">
      <div class="notch"></div>
      <div class="phone">
        <div class="phone-screen">
          <img id="shot" alt="App screenshot" />
        </div>
      </div>
    </div>
  </div>
  <script src="./frame-shared.js"></script>
</body>
</html>
